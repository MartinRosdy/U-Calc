[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "u-calc"
version = "0.2.0"
description = "Telegram bot and calculation core for building heat-loss estimates"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.28,<4",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
u-calc-bot = "u_calc.bot:main"
u-calc-demo = "u_calc.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
