services:
  bot:
    build: .
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in the environment}
      DATABASE_PATH: /app/data/u_calc.db
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Tashkent}
      ALLOWED_USER_IDS: ${ALLOWED_USER_IDS:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
      GLOBAL_RATE_LIMIT_PER_MINUTE: ${GLOBAL_RATE_LIMIT_PER_MINUTE:-600}
      CALCULATION_RATE_LIMIT_PER_MINUTE: ${CALCULATION_RATE_LIMIT_PER_MINUTE:-6}
      MAX_MESSAGE_LENGTH: ${MAX_MESSAGE_LENGTH:-4096}
      HISTORY_RETENTION_DAYS: ${HISTORY_RETENTION_DAYS:-730}
      DRAFT_TTL_DAYS: ${DRAFT_TTL_DAYS:-30}
    volumes:
      - u_calc_data:/app/data

volumes:
  u_calc_data:
